<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diario giornaliero</title>
<!-- SETUP
1. In config.js (stesso repository) metti il CLIENT_ID (lo stesso client OAuth di "Accedi con Google") e l’URL /exec dello script (vedi Code.gs).
2. Carica questo file come index.html su GitHub Pages.
3. Nel client OAuth, tra le "Origini JavaScript autorizzate", deve esserci https://TUOUTENTE.github.io (se la web app precedente era sullo stesso github.io, c’è già).
Senza accesso o senza rete i dati restano sul dispositivo e partono alla prima sincronizzazione riuscita. -->
<style>
:root{--bg:#eef1f4;--tx:#1c2530;--mu:#5d6b7a;--ln:#d3dae1;--ac:#1f5f8b;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--tx:#e6ebf0;--mu:#93a1af;--ln:#2a3541;--ac:#6bb0dd;--on:#0b1218}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 150px}
header{padding:8px 0 12px}h1{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
section{padding:14px 0;border-top:1px solid var(--ln)}
h2{font-size:15px;font-weight:600;margin:0 0 6px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit;width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;background:transparent}
input[type=range]{padding:0;border:0;accent-color:var(--ac)}
.c{display:flex;gap:10px;align-items:center;color:var(--tx)}.c input{width:22px;min-height:22px;accent-color:var(--ac)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}.r>*{width:auto}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}
button{cursor:pointer;font-weight:600;background:var(--ac);color:var(--on);border:0}
button.s{background:transparent;color:var(--tx);border:1px solid var(--ln)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
footer>*{max-width:560px;margin:0 auto}#st{font-size:14px;color:var(--mu);min-height:20px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#lock{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}#lock div{max-width:320px;width:100%;display:grid;gap:10px}#lm{color:var(--mu);font-size:14px;margin:0}
nav{display:flex;gap:8px;margin-bottom:8px}nav button{flex:1}
.k{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:16px 0 4px;font-size:14px;font-weight:600}
.k span{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:400;color:var(--mu)}
.mn{border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:4px 0 10px;margin:12px 0}
.mn summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.mn h3{font-size:13px;color:var(--mu);font-weight:600;margin:10px 0 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.sv{width:100%;display:block}.pd button{min-height:36px;padding:4px}
#det{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;font-size:13px;padding:14px 0}#det b{display:block;color:var(--mu);font-weight:400}
</style>
</head>
<body>
<main>
<header><h1>Diario giornaliero</h1><div class="r"><span id="who">Non connesso</span><div id="gbtn"></div></div></header>
<button id="bio" class="s" type="button" hidden style="margin-bottom:8px"></button>
<nav><button id="tI" type="button">Inserimento</button><button id="tA" type="button" class="s">Andamento</button></nav>
<div id="vIns">
<section>
<h2>Detta o scrivi</h2>
<textarea id="dett" rows="3" placeholder="es. sonno sei ore, occhio destro tre, sinistro due, pranzo pasta al pomodoro"></textarea>
<div class="row"><button id="mic" class="s" type="button">Detta</button><button id="go" class="s" type="button">Compila i campi</button></div>
</section>
<div id="form"></div>
</div>
<div id="vAnd" hidden></div>
</main>
<footer><div id="st"></div><div class="row"><button id="save">Salva</button><button id="sync" class="s">Sincronizza</button><button id="csv" class="s">Esporta CSV</button></div></footer>
<div id="lock" hidden><div><h1>Diario bloccato</h1><button id="unl" type="button">Sblocca</button><button id="ug" class="s" type="button">Usa Google invece</button><p id="lm"></p></div></div>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="initG()"></script>
<script>
const $=id=>document.getElementById(id);
// k: n numero, t testo, x testo lungo, s menu, b casella, r scala 0-N
const UI=[
['Sonno',[['n','sonno_ore','Sonno (ore)'],['s','sonno_qualita','Qualità',['','scarsa','media','buona']]]],
['Schermi',[['n','cellulare_h','Cellulare (h)'],['n','tablet_h','Tablet (h)'],['n','tv_h','TV (h)'],['n','pc_h','PC totale (h)'],['b','pc_sera_buio','PC serale in ambiente poco illuminato']]],
['Sintomi',[['r','occhio_dx','Occhio destro',5],['r','occhio_sx','Occhio sinistro',5],['r','fotofobia','Fotofobia',5],['r','blefarite','Blefarite',5],['r','psoriasi','Psoriasi',3]]],
['Prodotti usati',[['n','recugel','Recugel, n. applicazioni'],['n','naviblef','Naviblef, n. applicazioni'],['b','antistaminico','Antistaminico'],['t','altro_prodotto','Altro prodotto (nome, quante volte)'],['n','gocce_n','Gocce, n. applicazioni']]],
['Alimentazione',[['t','mattina','Mattina'],['t','pranzo','Pranzo'],['t','sera','Sera'],['t','spuntini','Spuntini (opzionale)']]],
['Meteo e note',[['n','sole_h','Ore di luce solare'],['x','note','Note libere']]]];
const COLS=['data'].concat(UI.flatMap(s=>s[1].map(f=>f[1])));
$('form').innerHTML='<section><h2>Data</h2><input type="date" id="data"></section>'+UI.map(([t,fs])=>'<section><h2>'+t+'</h2>'+fs.map(([k,id,l,x])=>{
 if(k=='n')return`<label for="${id}">${l}</label><input id="${id}" type="number" min="0" step="0.5" inputmode="decimal">`;
 if(k=='t')return`<label for="${id}">${l}</label><input id="${id}" type="text">`;
 if(k=='x')return`<label for="${id}">${l}</label><textarea id="${id}" rows="2"></textarea>`;
 if(k=='s')return`<label for="${id}">${l}</label><select id="${id}">${x.map(o=>`<option>${o}</option>`).join('')}</select>`;
 if(k=='b')return`<label class="c"><input id="${id}" type="checkbox">${l}</label>`;
 return`<label for="${id}" class="r"><span>${l} (0–${x})</span><b id="${id}_v">0</b></label><input id="${id}" type="range" min="0" max="${x}" step="1" value="0">`}).join('')+'</section>').join('');
document.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>$(r.id+'_v').textContent=r.value);
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome'}).format(new Date());
$('data').value=today();
['tv_h','tablet_h','gocce_n','recugel','naviblef'].forEach(id=>$(id).value=0);

// Dettato: parole chiave seguite da un valore. Numeri in cifre o a parole.
const W={zero:0,uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10};
const AL={sonno:'sonno_ore',cellulare:'cellulare_h',tablet:'tablet_h',tv:'tv_h',televisione:'tv_h',pc:'pc_h',computer:'pc_h','pc serale':'pc_sera_buio','occhio destro':'occhio_dx',destro:'occhio_dx','occhio sinistro':'occhio_sx',sinistro:'occhio_sx',fotofobia:'fotofobia',blefarite:'blefarite',psoriasi:'psoriasi',gocce:'gocce_n',sole:'sole_h','luce solare':'sole_h',colazione:'mattina',mattina:'mattina',pranzo:'pranzo',cena:'sera',sera:'sera',spuntini:'spuntini',spuntino:'spuntini','altro prodotto':'altro_prodotto',note:'note',nota:'note',recugel:'recugel',naviblef:'naviblef',antistaminico:'antistaminico'};
function num(s){const m=s.match(/\d+(?:[.,]\d+)?/);let n=null;if(m)n=parseFloat(m[0].replace(',','.'));else{const w=s.split(' ').find(x=>x in W);if(w)n=W[w]}
 if(/mezz/.test(s))n=(n||0)+.5;return n}
function parse(raw){
 const t=' '+raw.toLowerCase().replace(/[,.;:]/g,' ').replace(/\s+/g,' ')+' ';
 const re=new RegExp('(?<= )('+Object.keys(AL).sort((a,b)=>b.length-a.length).join('|')+')(?= )','g');
 const h=[];let m;while((m=re.exec(t)))h.push({id:AL[m[1]],s:m.index,e:m.index+m[1].length});
 const o={};
 h.forEach((x,j)=>{const seg=t.slice(x.e,j+1<h.length?h[j+1].s:t.length).trim(),el=$(x.id);
  if(el.type=='checkbox')o[x.id]=true;
  else if(el.type=='number'||el.type=='range'){let n=num(seg);if(n===null&&(x.id=='recugel'||x.id=='naviblef'))n=1;if(n!==null)o[x.id]=Math.min(n,el.max||99)}
  else if(seg)o[x.id]=seg});
 return o}
function apply(o){for(const id in o){const el=$(id);if(el.type=='checkbox')el.checked=!!o[id];else el.value=o[id];el.dispatchEvent(new Event('input'))}}
$('go').onclick=()=>{const o=parse($('dett').value),n=Object.keys(o).length;apply(o);$('st').textContent=n?'Compilati '+n+' campi: controlla e salva':'Nessun campo riconosciuto'};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
 if(!SR){$('st').textContent='Voce non supportata: usa Chrome o detta con la tastiera';return}
 const r=new SR();let got=0;r.lang='it-IT';
 r.onresult=e=>{got=1;$('dett').value=($('dett').value+' '+e.results[0][0].transcript).trim();$('go').click()};
 r.onerror=e=>{got=1;$('st').textContent='Voce non disponibile ('+e.error+'). Su Brave usa Chrome o Win+H'};
 r.onend=()=>{if(!got)$('st').textContent='Nessun audio riconosciuto'};
 $('st').textContent='Ascolto…';r.start()};

// Archivio locale: una riga per giorno
const KEY='diario_v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const store=d=>{try{localStorage.setItem(KEY,JSON.stringify(d));return 1}catch(e){$('st').textContent='Salvataggio locale non riuscito';return 0}};
function row(){const r={};COLS.forEach(c=>{const e=$(c);r[c]=e.type=='checkbox'?(e.checked?1:0):e.value});return r}
function fill(r){COLS.forEach(c=>{const e=$(c);if(e.type=='checkbox')e.checked=!!+r[c];else e.value=r[c]??'';e.dispatchEvent(new Event('input'))})}
$('save').onclick=()=>{const r=row();if(!/^\d{4}-\d{2}-\d{2}$/.test(r.data)){$('st').textContent='Inserisci la data';return}
 if(r.data>today()){$('st').textContent='Data nel futuro: controlla';return}
 const d=load();d[r.data]={row:r,sent:false};if(store(d)){$('st').textContent='Salvato sul dispositivo';sync()}};
$('data').onchange=()=>{const x=all()[$('data').value];if(x)fill(x)};
$('csv').onclick=()=>{const d=all(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[['schema_version'].concat(COLS).map(q).join(',')].concat(Object.keys(d).sort().map(k=>[2].concat(COLS.map(c=>d[k][c]??'')).map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='diario.csv';a.click()};

// Accesso Google: l’account si verifica una volta, poi lo script rilascia una sessione di 30 giorni per questo dispositivo
let bioOK=false,ses='';try{ses=localStorage.getItem('diario_ses')||''}catch(e){}
const post=async o=>(await fetch(CFG.SCRIPT_URL+'?'+Object.keys(o).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(typeof o[k]=='object'?JSON.stringify(o[k]):o[k])).join('&'),{redirect:'follow'})).json();
const endSes=()=>{ses='';try{localStorage.removeItem('diario_ses')}catch(e){}who();bioUI()};
function who(){$('who').textContent=ses?'Connesso (tocca per uscire)':'Non connesso';$('gbtn').hidden=!!ses}
$('who').onclick=()=>{if(ses&&confirm('Disconnettere questo dispositivo?'))endSes()};
async function login(cred){try{const j=await post({action:'login',token:cred});
 if(j.ok){ses=j.session;try{localStorage.setItem('diario_ses',ses)}catch(e){}who();bioUI();sync()}else $('st').textContent='Accesso rifiutato: '+j.error}
 catch(e){$('st').textContent='Accesso non riuscito ('+e.message+'). Controlla SCRIPT_URL'}}
function initG(){
 google.accounts.id.initialize({client_id:CFG.CLIENT_ID,callback:r=>login(r.credential),auto_select:true});
 google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'medium'});if(!ses)google.accounts.id.prompt()}
async function sync(){
 if(!ses){$('st').textContent='Accedi con Google per sincronizzare';return}
 const d=load();let n=0;
 for(const k in d){if(d[k].sent)continue;
  try{const j=await post({session:ses,row:d[k].row});
   if(j.ok){d[k].sent=true;n++}else{if(j.error=='sessione scaduta')endSes();$('st').textContent='Rifiutato: '+j.error;break}}
  catch(e){$('st').textContent='Sincronizzazione non riuscita ('+e.message+'): dati tenuti sul dispositivo. Controlla SCRIPT_URL';break}}
 store(d);if(n)$('st').textContent=n+(n>1?' giorni sincronizzati':' giorno sincronizzato');await pull()}
$('sync').onclick=sync;

// Dati remoti (foglio) uniti a quelli locali non ancora inviati
const rem=()=>{try{return JSON.parse(localStorage.getItem('diario_rem'))||{}}catch(e){return{}}};
const all=()=>{const m=rem(),d=load();for(const k in d)if(!d[k].sent||!m[k])m[k]=d[k].row;return m};
async function pull(){if(!ses)return;try{const j=await post({session:ses,action:'list'});
 if(j.ok){const m={};j.rows.forEach(x=>m[x.data]=x);localStorage.setItem('diario_rem',JSON.stringify(m));if(!$('vAnd').hidden)draw()}
 else if(j.error=='sessione scaduta')endSes()}catch(e){}}
who();if(ses)sync();

// Sblocco biometrico locale (facoltativo): chiede impronta o volto all’apertura dell’app su questo dispositivo.
// Se il dispositivo non ha un sensore il pulsante non compare. Non sostituisce l’accesso Google.
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),rnd=()=>crypto.getRandomValues(new Uint8Array(32));
let T=Date.now();
async function bioInit(){try{bioOK=!!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){}bioUI()}
function bioUI(){const b=$('bio');b.hidden=!(bioOK&&ses);b.textContent=localStorage.getItem('diario_bio')?'Sblocco biometrico attivo (tocca per disattivare)':'Attiva sblocco biometrico'}
$('bio').onclick=async()=>{
 if(localStorage.getItem('diario_bio')){localStorage.removeItem('diario_bio');bioUI();$('st').textContent='Sblocco biometrico disattivato';return}
 try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(),rp:{name:'Diario'},user:{id:rnd(),name:'diario',displayName:'Diario'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  localStorage.setItem('diario_bio',b64(c.rawId));bioUI();$('st').textContent='Sblocco biometrico attivato'}
 catch(e){$('st').textContent='Sblocco biometrico non attivato ('+(e.name||e.message)+')'}};
function lockIf(){if(ses&&localStorage.getItem('diario_bio')){$('lm').textContent='';$('lock').hidden=false}}
$('unl').onclick=async()=>{try{await navigator.credentials.get({publicKey:{challenge:rnd(),allowCredentials:[{type:'public-key',id:ub(localStorage.getItem('diario_bio'))}],userVerification:'required',timeout:60000}});$('lock').hidden=true;T=Date.now()}
 catch(e){$('lm').textContent='Non riuscito ('+(e.name||e.message)+'). Riprova oppure usa Google'}};
$('ug').onclick=()=>{localStorage.removeItem('diario_bio');endSes();$('lock').hidden=true};
document.addEventListener('visibilitychange',()=>{if(document.hidden)T=Date.now();else if(Date.now()-T>3e5)lockIf()});
bioInit();lockIf();

// Andamento
let per=30,selD=null,hid=new Set();
try{hid=new Set(JSON.parse(localStorage.getItem('diario_hid')||'[]'))}catch(e){}
const on=k=>!hid.has(k),sv=()=>{try{localStorage.setItem('diario_hid',JSON.stringify([...hid]))}catch(e){}};
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const add=(s,n)=>new Date(pd(s).getTime()+n*864e5).toISOString().slice(0,10);
const nv=x=>{const v=parseFloat(String(x).replace(',','.'));return isNaN(v)?null:v};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CL=['#2a78d6','#eb6834','#1baf7a','#eda100','#7a6ae0'],DS=['','5 3','1.5 3','7 2 1.5 2'];
const GR=[['Sintomi',[['occhio_dx','Occhio destro'],['occhio_sx','Occhio sinistro'],['fotofobia','Fotofobia'],['blefarite','Blefarite']]],['Schermi',[['pc_h','PC'],['cellulare_h','Cellulare'],['tv_h','TV'],['tablet_h','Tablet'],['pc_sera_buio','PC serale al buio']]],['Sonno e luce',[['sonno_ore','Sonno'],['sole_h','Luce solare']]],['Prodotti',[['naviblef','Naviblef'],['recugel','Recugel'],['gocce_n','Gocce']]]];
const view=v=>{$('vIns').hidden=v!='I';$('vAnd').hidden=v!='A';$('save').hidden=v!='I';$('tI').className=v=='I'?'':'s';$('tA').className=v=='A'?'':'s';if(v=='A')draw()};
$('tI').onclick=()=>view('I');$('tA').onclick=()=>view('A');
function draw(){
 const open=$('mn')&&$('mn').open,R=all(),n=per,W=640,PL=26,PR=6,bw=(W-PL-PR)/n,X=i=>PL+bw*i+bw/2,tw=Math.max(3,Math.min(24,bw*.8));
 const days=Array.from({length:n},(_,i)=>add(today(),i-n+1)),g=(i,k)=>{const r=R[days[i]];return r?nv(r[k]):null};
 const line=(a,k,col,dash)=>{let s='',pen=0;days.forEach((_,i)=>{const v=g(i,k);if(v===null){pen=0;return}s+=(pen?'L':'M')+X(i)+' '+a(v);pen=1});return`<path d="${s}" fill="none" style="stroke:${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${dash}"/>`};
 const bar=(a,i,k,col,x0,w)=>{const v=g(i,k);return v?`<rect x="${X(i)+x0}" y="${a(v)}" width="${w}" height="${a(0)-a(v)}" rx="2" style="fill:${col}"/>`:''};
 const dots=(a,k,col)=>days.map((_,i)=>{const v=g(i,k);return v===null?'':`<circle cx="${X(i)}" cy="${a(v)}" r="3" style="fill:${col};stroke:var(--bg);stroke-width:2"/>`}).join('');
 const SY=[['occhio_dx',CL[0],DS[0],'Occhio destro'],['occhio_sx',CL[1],DS[1],'Occhio sinistro'],['fotofobia',CL[2],DS[2],'Fotofobia'],['blefarite',CL[4],DS[3],'Blefarite']].filter(x=>on(x[0]));
 const SK=[['pc_h',CL[0],'PC'],['cellulare_h',CL[1],'Cellulare'],['tv_h',CL[2],'TV'],['tablet_h',CL[3],'Tablet']].filter(x=>on(x[0]));
 const PK=[['naviblef',CL[1],'Naviblef'],['recugel',CL[2],'Recugel'],['gocce_n',CL[3],'Gocce']].filter(x=>on(x[0]));
 const tot=i=>SK.reduce((t,x)=>t+(g(i,x[0])||0),0),M=Math.max;
 const mS=M(5,Math.ceil(M(0,...days.map((_,i)=>tot(i)))/5)*5);
 const mZ=M(9,Math.ceil(M(0,...days.flatMap((_,i)=>[on('sonno_ore')?g(i,'sonno_ore')||0:0,on('sole_h')?g(i,'sole_h')||0:0]))/3)*3);
 const mP=M(4,Math.ceil(M(0,...days.flatMap((_,i)=>PK.map(x=>g(i,x[0])||0)))/2)*2);
 const P=[
 SY.length&&{t:'Sintomi (0–5)',max:5,st:1,L:SY.map(x=>[x[3],x[1],'l',x[2]]),a:'Linee dei sintomi',d:a=>SY.map(x=>line(a,x[0],x[1],x[2])+(n<=30?dots(a,x[0],x[1]):'')).join('')},
 (SK.length||on('pc_sera_buio'))&&{t:'Schermi (ore)',max:mS,st:5,L:SK.map(x=>[x[2],x[1],'b']).concat(on('pc_sera_buio')?[['PC serale al buio','var(--tx)','d']]:[]),a:'Barre impilate delle ore di schermo',d:a=>days.map((_,i)=>{let b=0,s='';SK.forEach(x=>{const v=g(i,x[0]);if(!v)return;const y0=a(b),y1=a(b+v);s+=`<rect x="${X(i)-tw/2}" y="${y1}" width="${tw}" height="${M(y0-y1-1.5,1)}" rx="2" style="fill:${x[1]}"/>`;b+=v});const r=R[days[i]];if(on('pc_sera_buio')&&r&&+r.pc_sera_buio)s+=`<circle cx="${X(i)}" cy="${a(b)-7}" r="3.5" style="fill:var(--tx)"/>`;return s}).join('')},

 PK.length&&{t:'Prodotti (applicazioni)',max:mP,st:mP/2,L:PK.map(x=>[x[2],x[1],'b']),a:'Barre delle applicazioni giornaliere',d:a=>days.map((_,i)=>PK.map((x,j)=>bar(a,i,x[0],x[1],-tw/2+j*tw/PK.length,tw/PK.length-.5)).join('')).join('')}].filter(Boolean);

 const have=days.some(d=>R[d]),hn=hid.size;

 const st=n<=14?1:n<=30?3:10;

 $('vAnd').onclick=e=>{const t=e.target,ga=a=>t.getAttribute&&t.getAttribute(a);
